[package]
name = "alvr_android_lib_no_ovr"
version = "0.1.0"
license = "MIT"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
crate_type = ["cdylib"]

[dependencies]
alvr_audio = { path = "../../alvr/audio" }
alvr_common = { path = "../../alvr/common" }
alvr_session = { path = "../../alvr/session" }
alvr_sockets = { path = "../../alvr/sockets" }
alvr_packets = { path = "../../alvr/packets" }

jni = "0.21.1"

# Basic utilities
once_cell = "1.8"
parking_lot = "0.12.3"
# Serialization
bincode = "1.3"
serde = "1.0"
serde_json = "1.0"
#settings-schema = { path = "../../settings-schema", features = [ "rename_camel_case" ] }
# Async and networking
bytes = "1.1"
futures = "0.3"
tokio = { version = "1.14", features = ["rt-multi-thread", "macros", "sync", "time"] }
# Miscellaneous
log = "0.4"
reed-solomon-erasure = "4.0"
semver = "1.0"

[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.14.1"
oboe = "0.6.1" # Note: cannot use feature "java-interface" to query audio info

[dev-dependencies]
simple_logger = "1.16"