plugins {
    id 'com.android.library'
    id 'kotlin-android'
    id 'org.jetbrains.kotlin.plugin.serialization'
    id 'org.mozilla.rust-android-gradle.rust-android'
    id 'maven-publish'
}

ext {
    groupId = 'io.github.alvr'
    versionName = '17.0.0'
}

group = groupId
version = versionName

android {
    namespace "io.github.alvr.android.lib"
    compileSdk 31
    def ndkPathProp = project.findProperty("ndkPath") ?: System.getenv("ANDROID_NDK_HOME")
    def ndkVersionProp = project.findProperty("ndkVersion")
    if (ndkPathProp) {
        ndkPath ndkPathProp
        if (!ndkVersionProp) {
            def propsFile = file("${ndkPathProp}/source.properties")
            if (propsFile.exists()) {
                def line = propsFile.readLines().find { it.startsWith("Pkg.Revision") }
                if (line) {
                    ndkVersionProp = line.split("=").last().trim()
                }
            }
        }
    }
    if (ndkVersionProp) {
        ndkVersion ndkVersionProp
    }

    defaultConfig {
        minSdk 26
        targetSdk 31
        versionCode 1
        versionName versionName

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }

    // Ensure libc++_shared.so is packaged into the AAR so Unity can load libalvr_android.so.
    sourceSets {
        main {
            jniLibs.srcDirs += file("$buildDir/generated/libcxx")
        }
    }
}

def libcxxOutDir = file("$buildDir/generated/libcxx")
def libcxxTriples = [
        "arm64-v8a"  : "aarch64-linux-android",
        "armeabi-v7a": "arm-linux-androideabi"
]

tasks.register("copyLibcxxShared") {
    doLast {
        libcxxTriples.each { abi, triple ->
            def src = new File(android.ndkDirectory,
                    "toolchains/llvm/prebuilt/windows-x86_64/sysroot/usr/lib/${triple}/libc++_shared.so")
            def dstDir = new File(libcxxOutDir, abi)
            if (!src.exists()) {
                throw new GradleException("Missing libc++_shared.so for ${abi}. Expected: ${src}")
            }
            dstDir.mkdirs()
            copy {
                from src
                into dstDir
            }
        }
    }
}

tasks.named("preBuild").configure {
    dependsOn "copyLibcxxShared"
}

dependencies {
    api 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.5.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.4.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.3.1'
    implementation 'androidx.core:core-ktx:1.7.0'
    implementation 'androidx.appcompat:appcompat:1.4.0'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.3'
}

cargo {
    module = ".."
    libname = "alvr_android"
    targets = ["arm64", "arm"]
    targetDirectory = "../../../../target"
    // NDK r23+ removed arm-linux-androideabi-ar; use llvm-ar instead
    exec = { spec, toolchain ->
        def llvmAr = new File(android.ndkDirectory, "toolchains/llvm/prebuilt/windows-x86_64/bin/llvm-ar.exe")
        spec.environment("AR_armv7-linux-androideabi", llvmAr.absolutePath)
        spec.environment("AR_armv7_linux_androideabi", llvmAr.absolutePath)
        spec.environment("AR_aarch64-linux-android", llvmAr.absolutePath)
        // Force libc++_shared into DT_NEEDED via RUSTFLAGS
        def existingRustFlags = spec.environment.get("RUSTFLAGS") ?: ""
        spec.environment("RUSTFLAGS", "${existingRustFlags} -C link-arg=-Wl,--no-as-needed -C link-arg=-lc++_shared -C link-arg=-Wl,--as-needed".trim())
    }
}

tasks.whenTaskAdded { task ->
    if (task.name.startsWith('javaPreCompile')) {
        task.dependsOn 'cargoBuild'
    }
}

// see: https://developer.android.com/studio/build/maven-publish-plugin?hl=ja
afterEvaluate {
    publishing {
        publications {
            release(MavenPublication) {
                from components.release
            }
            debug(MavenPublication) {
                from components.debug
                artifactId = "${project.name}-debug"
            }
        }
    }
}